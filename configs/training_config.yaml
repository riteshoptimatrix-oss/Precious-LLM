# configs/training_config.yaml — Training hyperparameters

training:
  # --- Pretraining (Stage C) ---
  pretrain:
    batch_size: 32
    max_seq_length: 512
    num_epochs: 50
    learning_rate: 3.0e-4
    weight_decay: 0.01
    warmup_steps: 500
    max_grad_norm: 1.0
    optimizer: "adamw"
    scheduler: "cosine"
    eval_every_n_steps: 100
    save_every_n_steps: 500
    log_every_n_steps: 10
    
  # --- Supervised Fine-Tuning (Stage D) ---
  finetune:
    batch_size: 16
    max_seq_length: 512
    num_epochs: 10
    learning_rate: 5.0e-5          # Lower LR for fine-tuning
    weight_decay: 0.01
    warmup_steps: 100
    max_grad_norm: 1.0
    optimizer: "adamw"
    scheduler: "cosine"
    eval_every_n_steps: 50
    save_every_n_steps: 200
    loss_on_assistant_only: true   # SFT: compute loss only on assistant tokens

  # --- Domain Adaptation (Stage E) ---
  domain:
    batch_size: 16
    num_epochs: 5
    learning_rate: 3.0e-5          # Even lower LR for domain adaptation
    mix_general_data: true         # Mix general + domain data to prevent forgetting
    general_data_ratio: 0.3        # 30% general, 70% domain

# --- Data ---
data:
  train_path: "../data/datasets/conversational/train.jsonl"
  val_path: "../data/datasets/conversational/val.jsonl"
  test_path: "../data/datasets/conversational/test.jsonl"
  num_workers: 2
